<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artículos</title>
<style>
  :root {
    --fondo: #f4f6f8;
    --panel: #ffffff;
    --tinta: #16202e;
    --suave: #66727f;
    --linea: #dde2e8;
    --acento: #27407a;
    --sobre-acento: #ffffff;
    --peligro: #a5281f;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --fondo: #11161d;
      --panel: #18202a;
      --tinta: #e8ecf1;
      --suave: #93a0ae;
      --linea: #2a3441;
      --acento: #8fa8e8;
      --sobre-acento: #0e1626;
      --peligro: #f0a49d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 56px 24px 72px;
    background: var(--fondo); color: var(--tinta);
    font-family: var(--sans); line-height: 1.5;
  }
  .pagina { max-width: 980px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 2.6rem; line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.01em; }
  .sub { margin: 0; color: var(--suave); }
  #mensaje { min-height: 1.5em; margin: 0 0 24px; font-size: .95rem; color: var(--acento); }
  #mensaje.error { color: var(--peligro); }

  .layout { display: grid; grid-template-columns: 330px 1fr; gap: 56px; align-items: start; }

  aside { position: sticky; top: 24px; background: var(--panel); border: 1px solid var(--linea); border-radius: 4px; padding: 24px; }
  h2 { font-family: var(--serif); font-weight: 600; font-size: 1.35rem; margin: 0 0 20px; }
  .campos { display: grid; gap: 20px; margin-bottom: 24px; }
  label { display: grid; gap: 6px; font-size: .9rem; color: var(--suave); }
  .ayuda { font-size: .8rem; }
  input {
    font: inherit; font-size: 1.05rem; color: var(--tinta);
    background: transparent; border: 0; border-bottom: 1px solid var(--linea);
    padding: 6px 0; border-radius: 0;
  }
  input:focus { outline: none; border-bottom-color: var(--acento); box-shadow: 0 1px 0 var(--acento); }

  .grupo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  button {
    font: inherit; cursor: pointer; border-radius: 4px; padding: 10px 12px;
    border: 1px solid var(--linea); background: transparent; color: var(--tinta);
  }
  button:hover { border-color: var(--acento); }
  button.principal { background: var(--acento); color: var(--sobre-acento); border-color: var(--acento); font-weight: 600; }
  button.peligro { color: var(--peligro); }
  button.ancho { width: 100%; }
  button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

  .cabecera-lista { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  #cuenta { margin: 0 0 12px; color: var(--suave); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linea); }
  li {
    display: grid; grid-template-columns: 1fr auto auto; align-items: baseline; gap: 8px 24px;
    padding: 16px 0; border-bottom: 1px solid var(--linea);
  }
  .nombre { font-size: 1.1rem; font-weight: 500; }
  .codigo { display: block; font-size: .85rem; color: var(--suave); font-weight: 400; }
  .precio { font-family: var(--serif); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  li button { border: 0; padding: 4px 8px; font-size: .9rem; color: var(--acento); }
  li button:hover { text-decoration: underline; }
  .vacio { color: var(--suave); padding: 24px 0; max-width: 42ch; }
  button:disabled {
    cursor: wait;
    opacity: .65;
  }

  @media (max-width: 800px) {
    body { padding: 32px 16px 56px; }
    h1 { font-size: 2rem; }
    .layout { grid-template-columns: 1fr; gap: 32px; }
    aside { position: static; }
  }

  @media (max-width: 560px) {
    li {
      grid-template-columns: 1fr auto;
    }
    li button {
      grid-column: 1 / -1;
      justify-self: start;
    }
  }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <h1>Artículos</h1>
    <p class="sub">Panel para guardar, consultar, actualizar y eliminar artículos.</p>
  </header>

  <p id="mensaje" role="status"></p>

  <div class="layout">
    <aside>
      <h2>Datos del artículo</h2>
      <form id="formulario-articulos">
        <div class="campos">
          <label>ID
            <input id="id" name="id" type="number" min="1" step="1" placeholder="Ej: 1">
            <span class="ayuda">Se usa para buscar, actualizar o eliminar.</span>
          </label>
          <label>Nombre
            <input id="nombre" name="nombre" maxlength="100" autocomplete="off" required>
          </label>
          <label>Precio
            <input id="precio" name="precio" type="number" step="0.01" min="0" required>
          </label>
        </div>

        <div class="grupo">
          <button type="submit" class="principal" id="btn-guardar">Guardar</button>
          <button type="button" id="btn-actualizar">Actualizar</button>
        </div>
        <div class="grupo">
          <button type="button" id="btn-buscar">Buscar por ID</button>
          <button type="button" id="btn-listar">Listar todos</button>
        </div>
        <div class="grupo">
          <button type="button" class="peligro" id="btn-eliminar">Eliminar por ID</button>
          <button type="button" id="btn-limpiar">Limpiar</button>
        </div>
      </form>
    </aside>

    <main>
      <div class="cabecera-lista">
        <h2 id="titulo-lista">Todos los artículos</h2>
      </div>
      <p id="cuenta"></p>
      <ul id="lista"></ul>
      <p class="vacio" id="vacio" hidden>No hay artículos para mostrar. Completa nombre y precio, y presiona Guardar.</p>
    </main>
  </div>
</div>

<script>
  // Dirección de la API (el controller usa @CrossOrigin, por eso se puede llamar desde esta página)
  const API = "http://localhost:8080/api/articulos";

  const campoId = document.getElementById("id");
  const campoNombre = document.getElementById("nombre");
  const campoPrecio = document.getElementById("precio");
  const lista = document.getElementById("lista");
  const vacio = document.getElementById("vacio");
  const cuenta = document.getElementById("cuenta");
  const tituloLista = document.getElementById("titulo-lista");
  const mensaje = document.getElementById("mensaje");
  const formulario = document.getElementById("formulario-articulos");
  const moneda = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS" });

  function avisar(texto, esError) {
    mensaje.textContent = texto;
    mensaje.className = esError ? "error" : "";
  }

  function establecerCargando(cargando) {
    document.querySelector(".pagina").setAttribute("aria-busy", String(cargando));
    document.querySelectorAll("button").forEach((boton) => {
      boton.disabled = cargando;
    });
  }

  // Hace la petición y, si no hay conexión, avisa con un mensaje claro
  async function llamar(url, opciones) {
    try {
      return await fetch(url, opciones);
    } catch (e) {
      avisar("No se pudo conectar con la API. Revisa que MySQL esté iniciado en XAMPP y que la aplicación esté corriendo.", true);
      return null;
    }
  }

  async function leerRespuesta(resp) {
    if (resp.status === 204) return null;

    const contentType = resp.headers.get("content-type");
    if (contentType && contentType.includes("application/json")) {
      try {
        return await resp.json();
      } catch (e) {
        avisar("La API devolvió una respuesta JSON inválida.", true);
        return null;
      }
    }

    return null;
  }

  function leerId() {
    const texto = campoId.value.trim();
    const id = Number(texto);

    if (
      texto === "" ||
      !Number.isInteger(id) ||
      id < 1
    ) {
      avisar("Escribe un ID válido mayor que cero.", true);
      campoId.focus();
      return null;
    }

    return id;
  }

  function leerDatos() {
    const nombre = campoNombre.value.trim();
    const textoPrecio = campoPrecio.value.trim();
    const precio = Number(textoPrecio);

    if (
      nombre === "" ||
      textoPrecio === "" ||
      !Number.isFinite(precio) ||
      precio < 0
    ) {
      avisar("Completa el nombre y un precio válido.", true);
      return null;
    }
    return { nombre, precio };
  }

  // GET /api/articulos: lista todos
  async function listar() {
    establecerCargando(true);
    try {
      const resp = await llamar(API);
      if (!resp) return;
      if (!resp.ok) { avisar("No se pudo listar (estado " + resp.status + ").", true); return; }
      dibujar(await leerRespuesta(resp) || [], "Todos los artículos");
    } finally {
      establecerCargando(false);
    }
  }

  // GET /api/articulos/{id}: busca uno
  async function buscar() {
    const id = leerId();
    if (!id) return;
    establecerCargando(true);
    try {
      const resp = await llamar(API + "/" + encodeURIComponent(id));
      if (!resp) return;
      if (resp.status === 404) { avisar("No existe un artículo con ID " + id + ".", true); return; }
      if (!resp.ok) { avisar("No se pudo buscar (estado " + resp.status + ").", true); return; }
      const a = await leerRespuesta(resp);
      if (!a) { avisar("La API no devolvió datos del artículo.", true); return; }
      cargar(a);
      dibujar([a], "Resultado de la búsqueda");
      avisar("Artículo encontrado.", false);
    } finally {
      establecerCargando(false);
    }
  }

  // POST /api/articulos: crea uno nuevo
  async function guardar() {
    const datos = leerDatos();
    if (!datos) return;
    establecerCargando(true);
    try {
      const resp = await llamar(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      });
      if (!resp) return;
      if (!resp.ok) { avisar("No se pudo guardar (estado " + resp.status + ").", true); return; }
      const nuevo = await leerRespuesta(resp);
      if (nuevo && nuevo.id) {
        avisar("Artículo guardado con ID " + nuevo.id + ".", false);
      } else {
        avisar("Artículo guardado.", false);
      }
      limpiar(false);
      await listar();
    } finally {
      establecerCargando(false);
    }
  }

  // PUT /api/articulos/{id}: reemplaza los datos de uno existente
  async function actualizar() {
    const id = leerId();
    if (!id) return;
    const datos = leerDatos();
    if (!datos) return;
    establecerCargando(true);
    try {
      const resp = await llamar(API + "/" + encodeURIComponent(id), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      });
      if (!resp) return;
      if (resp.status === 404) { avisar("No existe un artículo con ID " + id + ".", true); return; }
      if (!resp.ok) { avisar("No se pudo actualizar (estado " + resp.status + ").", true); return; }
      avisar("Artículo " + id + " actualizado.", false);
      limpiar(false);
      await listar();
    } finally {
      establecerCargando(false);
    }
  }

  // DELETE /api/articulos/{id}: elimina uno
  async function eliminar() {
    const id = leerId();
    if (!id) return;
    if (!confirm("¿Eliminar el artículo con ID " + id + "?")) return;
    establecerCargando(true);
    try {
      const resp = await llamar(API + "/" + encodeURIComponent(id), { method: "DELETE" });
      if (!resp) return;
      if (resp.status === 404) { avisar("No existe un artículo con ID " + id + ".", true); return; }
      if (!resp.ok) { avisar("No se pudo eliminar (estado " + resp.status + ").", true); return; }
      avisar("Artículo " + id + " eliminado.", false);
      limpiar(false);
      await listar();
    } finally {
      establecerCargando(false);
    }
  }

  function cargar(a) {
    campoId.value = a.id;
    campoNombre.value = a.nombre;
    campoPrecio.value = a.precio;
  }

  function limpiar(conAviso) {
    campoId.value = "";
    campoNombre.value = "";
    campoPrecio.value = "";
    if (conAviso) avisar("", false);
  }

  function dibujar(articulos, titulo) {
    tituloLista.textContent = titulo;
    cuenta.textContent = articulos.length === 1 ? "1 artículo" : articulos.length + " artículos";
    vacio.hidden = articulos.length > 0;
    lista.replaceChildren();

    for (const a of articulos) {
      const li = document.createElement("li");

      const nombre = document.createElement("span");
      nombre.className = "nombre";
      nombre.textContent = a.nombre;          // textContent evita inyectar HTML
      const codigo = document.createElement("span");
      codigo.className = "codigo";
      codigo.textContent = "ID " + a.id;
      nombre.append(codigo);

      const precio = document.createElement("span");
      precio.className = "precio";
      precio.textContent = moneda.format(a.precio);

      const usar = document.createElement("button");
      usar.textContent = "Seleccionar";
      usar.onclick = () => { cargar(a); avisar("Artículo " + a.id + " cargado en el formulario.", false); };

      li.append(nombre, precio, usar);
      lista.append(li);
    }
  }

  document.getElementById("btn-actualizar").onclick = actualizar;
  document.getElementById("btn-buscar").onclick = buscar;
  document.getElementById("btn-listar").onclick = listar;
  document.getElementById("btn-eliminar").onclick = eliminar;
  document.getElementById("btn-limpiar").onclick = () => limpiar(true);
  formulario.addEventListener("submit", (evento) => {
    evento.preventDefault();
    guardar();
  });

  listar();   // al abrir la página, carga la lista
</script>
</body>
</html>
